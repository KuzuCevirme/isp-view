# Push a tag like v1.0.0 to build ISPView.exe and attach it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Check sources compile
        run: python -m py_compile ispview.py capture.py quic.py
      - name: Build exe
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ISPView
          path: dist/ISPView.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ISPView.exe
          generate_release_notes: true
